services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: e_cooperative
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD for the local database}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d e_cooperative"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
